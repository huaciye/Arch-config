[main]
#font=Source Code Pro:size=13
font=JetBrainsMonoNerdFontPropo:size=13
pad=8x12
selection-target=none


[security]
osc52=enabled


[bell]
system=no
urgent=no
notify=yes
visual=no
# command=
# command-focused=no


[desktop-notifications]
# command=notify-send --wait --app-name ${app-id} --icon ${app-id} --category ${category} --urgency ${urgency} --expire-time ${expire-time} --hint STRING:image-path:${icon} --hint BOOLEAN:suppress-sound:${muted} --hint STRING:sound-name:${sound-name} --replace-id ${replace-id} ${action-argument} --print-id -- ${title} ${body}
# command-action-argument=--action ${action-name}=${action-label}
# close=""
# inhibit-when-focused=yes


[scrollback]
lines=1000


[url]
launch=firefox ${url}
osc8-underline=url-mode


[cursor]
style=beam
blink=yes


[mouse]
hide-when-typing=no
alternate-scroll-mode=yes


[colors-dark]
alpha=0.7
foreground=C0C0C0
background=000000
regular0=2e3436  # black
regular1=cc0000  # red
regular2=73d216  # green
regular3=edd400  # yellow
regular4=3465a4  # blue
regular5=75507b  # magenta
regular6=06989a  # cyan
regular7=d3d7cf  # white
bright0=2e3436   # bright black
bright1=ef2929   # bright red
bright2=8ae234   # bright green
bright3=fce94f   # bright yellow
bright4=729fcf   # bright blue
bright5=ad7fa8   # bright magenta
bright6=34e2e2   # bright cyan
bright7=eeeeec   # bright white
selection-background=555555
selection-foreground=ffffff


